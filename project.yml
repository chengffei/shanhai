name: Shanhai
options:
  bundleIdPrefix: io.github.chengffei
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Shanhai:
    type: application
    platform: macOS
    sources:
      - path: Shanhai
        excludes: [Resources]
      - path: Shanhai/Resources/Geo
        type: folder
        buildPhase: resources
      - path: Shanhai/Resources/Content
        type: folder
        buildPhase: resources
      - path: Shanhai/Resources/Shaders.msl
        buildPhase: resources
      - path: Shanhai/Resources/AppIcon.icns
        buildPhase: resources
    entitlements:
      path: Shanhai/Shanhai.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Shanhai/Info.plist
      properties:
        CFBundleName: 山海
        CFBundleDisplayName: 山海
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 Felix"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.chengffei.shanhai
        CODE_SIGN_IDENTITY: "-"
